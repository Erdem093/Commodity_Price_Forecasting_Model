project:
  timezone: "UTC"
  random_seed: 42

artifacts:
  base_dir: "artifacts"

data:
  primary_ticker: "CL=F"
  context_tickers:
    - "DX-Y.NYB"
    - "^VIX"
  weather:
    base_temp_c: 18.0
    cities:
      - {name: "New York", lat: 40.7128, lon: -74.0060, weight: 0.25}
      - {name: "Chicago", lat: 41.8781, lon: -87.6298, weight: 0.25}
      - {name: "Houston", lat: 29.7604, lon: -95.3698, weight: 0.25}
      - {name: "Los Angeles", lat: 34.0522, lon: -118.2437, weight: 0.25}

features:
  return_lags: [1, 2, 5]
  vol_windows: [5, 10, 20]
  ma_windows: [5, 10, 20]
  weather_anom_window: 30

training:
  train_window_days: 504
  test_window_days: 21
  min_train_rows: 252

models:
  logistic_regression:
    C: 1.0
    max_iter: 1000
  random_forest:
    n_estimators: 400
    max_depth: 6
    min_samples_leaf: 5
    random_state: 42
  lightgbm:
    n_estimators: 500
    learning_rate: 0.03
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42

strategy:
  p_threshold: 0.55
  transaction_cost_bps: 3.0
